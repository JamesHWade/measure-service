skill:
  enabled: true
  well_known: true
  gotchas:
    - "Never convert missing, not_detected, below_limit, censored, failed or infeasible outcomes to zero."
    - "All registry, batch, method, observation and campaign writes require an idempotency_key scoped to the principal. Reusing a key with different arguments fails."
    - "Dataset registration and single-trace analysis calls are not idempotent and create a new record each time."
    - "Use MEASURE_MCP_TOOL_GROUPS to scope clients to focused tool groups (default client config selects discovery, traces and evidence)."
    - "HTTP mode requires a trusted authentication proxy (such as Posit Connect). Header parsing alone is not authentication."
  best_practices:
    - "Call measurement_capabilities first to inspect installed analytical backends and available tool groups."
    - "Use measure-service-client config and check commands to generate verified Claude Code or Codex MCP configurations."
    - "Inspect warnings, input digests and backend fingerprints alongside every stored analysis before linking results into outcomes or observation snapshots."
    - "Use measurement_revise_attempt for record corrections, measurement_supersede_experiment for design replacements, and a new attempt for a separate physical run."
  decision_table:
    - need: "Check installed backends and service capabilities"
      use: "measurement_capabilities / measurement_registry_capabilities"
    - need: "Import 1D traces or native DAD/LC-MS acquisitions"
      use: "measurement_register_csv / measurement_register_wide_csv / measurement_register_acquisition"
    - need: "Inspect 2D DAD planes or scan-linked centroid XICs"
      use: "measurement_read_dad_plane / measurement_extract_ms_trace"
    - need: "Process chromatograms, quantify peaks or run relative SEC"
      use: "measurement_analyze_chromatogram / measurement_quantify_peak / measurement_analyze_sec"
    - need: "Run resumable parallel chromatogram batches and export snapshots"
      use: "measurement_create_chromatogram_batch -> measurement_run_chromatogram_batch -> measurement_export_chromatogram_batch"
    - need: "Validate LC gradient timing, constraints and solvent use"
      use: "measurement_validate_method / measurement_register_method"
    - need: "Track designs, revisions, mapped outcome tables and evidence-linked results"
      use: "measurement_create_experiment -> measurement_record_attempt -> measurement_record_results"
    - need: "Evaluate analytical acceptance and run matched synthetic BO campaigns"
      use: "measurement_evaluate_observation -> measurement_create_observation_snapshot -> measurement_suggest_campaign"

seo:
  enabled: true
  default_description: "Connect AI assistants to reproducible analytical chemistry workflows: chromatogram integration, peak quantitation, SEC/GPC molecular weights, LC-DAD and LC-MS inspection, LC gradient checks, and traceable experiment records."
