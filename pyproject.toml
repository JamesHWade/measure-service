[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "measure-service"
version = "0.1.0.dev0"
description = "MCP tools for analytical traces and experiment result tracking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "James Wade"}]
dependencies = [
  "mcp==1.30.0",
  "measure-methods @ git+https://github.com/JamesHWade/measure-methods.git@codex/linear-program-usage",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.14.0",
  "build==1.3.0",
  "air-formatter==0.12.0",
  "jarl-linter==0.7.1",
]

[project.scripts]
measure-service = "measure_service.server:main"

[project.urls]
Repository = "https://github.com/JamesHWade/measure-service"
Issues = "https://github.com/JamesHWade/measure-service/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
measure_service = ["worker.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["r_backend: requires R, measure, and the corrected measure.sec backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
