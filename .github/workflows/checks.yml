name: Service checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} contracts and docs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: air format --check .
      - run: jarl check .
      - run: python scripts/render_reference.py --check
      - run: python scripts/check_docs.py
      - run: python -m pytest -q -m 'not r_backend'

  distribution:
    name: Installed wheel and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/measure-wheel
          /tmp/measure-wheel/bin/python -m pip install dist/*.whl pytest==9.2.0
      - name: Test installed package outside the checkout
        working-directory: /tmp
        run: |
          /tmp/measure-wheel/bin/python -m pytest -q "$GITHUB_WORKSPACE/tests" -m 'not r_backend'
          /tmp/measure-wheel/bin/python "$GITHUB_WORKSPACE/examples/registry.py"
      - name: Install source archive and run the example
        run: |
          python -m venv /tmp/measure-sdist
          /tmp/measure-sdist/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/measure-sdist/bin/python "$GITHUB_WORKSPACE/examples/registry.py"

  r-integration:
    name: R-backed numerical workflows
    runs-on: ubuntu-latest
    env:
      MEASURE_MCP_MEASURE_REVISION: aac4cf0c6b99b8c7ce868fb43f30478fd663bf25
      MEASURE_MCP_SEC_REVISION: a3ff1fe965f53b6388a3ce535746ff40fdbda0c2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::jsonlite
            any::tibble
            tidymodels/recipes@04c2139b011810ea1e56eca947a3ca932ea3c38a
            JamesHWade/measure@aac4cf0c6b99b8c7ce868fb43f30478fd663bf25
            JamesHWade/measure.sec@a3ff1fe965f53b6388a3ce535746ff40fdbda0c2
          cache-version: 1
      - run: python -m pip install '.[dev]'
      - name: Run full service suite against the R backends
        run: MEASURE_MCP_TEST_R="$(command -v R)" python -m pytest -q
