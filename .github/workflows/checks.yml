          assert "docs/peak-boundaries.md" in members
          assert "tests/test_peak_boundary_bridge.py" in members
          for name in ("tool_server", "tool_catalog"):
              assert "src/measure_service/" + name + ".py" in members
          for name in ("tool_catalog", "method_schema_bounds", "tool_identity_dispatch", "tool_deployment"):
              assert "tests/test_" + name + ".py" in members
          assert "scripts/check_tool_schemas.py" in members
          assert "docs/tool-catalog.md" in members
          assert "docs/connect-identity-cost.md" in members
          for name in ("storage_readonly", "observational_reads", "readiness_budget"):
              assert "tests/test_" + name + ".py" in members
          assert "src/measure_service/http_authority.py" in members
          assert "tests/test_http_authority.py" in members
          assert "tests/test_authority_startup.py" in members
          assert "tests/test_public_proxy_pilot.py" in members
          assert "docs/http-authorities.md" in members
          assert "docs/pilot-readiness.md" in members
          assert "docs/store-recovery-example.md" in members
          assert "examples/store_recovery.py" in members
          assert "tests/test_store_recovery_example.py" in members
          assert "src/measure_service/design_lineage_client.py" in members
          assert "src/measure_service/bounded_json.py" in members
          assert "tests/test_design_lineage_client.py" in members
          assert "tests/test_design_lineage_mcp.py" in members
          assert "tests/test_bounded_json.py" in members
          assert "examples/design_lineage.py" in members
          assert "tests/test_design_lineage_example.py" in members
          assert "docs/design-lineage-example.md" in members
          assert "tests/test_design_lineage_publication.py" in members
          for name in ("designs.json", "lineage.json", "replacement-v1-v2.json", "replacement-v2-v3.json", "attempts.json", "results.json", "observations.json", "snapshot.json", "history.csv", "workflow_receipt.json", "index.html", "manifest.json", "execution.json", "independent-review.json", "publication.json"):
