          assert "src/measure_service/batch_bundle.py" in members
          assert "tests/test_batch_bundle.py" in members
          assert "docs/batch-snapshots.md" in members
          assert "docs/batch-snapshot-example.md" in members
          assert "docs/chromatogram-snapshot-results.md" in members
          assert "docs/result-table-format.md" in members
          assert "src/measure_service/result_table_models.py" in members
          assert "src/measure_service/result_table_parser.py" in members
          assert "tests/test_result_table_parser.py" in members
          assert "docs/result-table-import.md" in members
          assert "src/measure_service/result_table_schema.py" in members
          assert "src/measure_service/result_tables.py" in members
          assert "tests/test_result_table_schema.py" in members
          assert "tests/test_result_tables.py" in members
          assert "docs/result-tables.md" in members
          assert "src/measure_service/design_lineage.py" in members
          assert "src/measure_service/design_lineage_schema.py" in members
          assert "tests/test_design_lineage.py" in members
          assert "tests/test_design_lineage_schema.py" in members
          assert "tests/test_design_lineage_boundaries.py" in members
          assert "docs/design-lineage.md" in members
          assert "src/measure_service/pilot_numerics.py" in members
          assert "tests/test_pilot_numerics.py" in members
          assert "docs/pilot-numerics.md" in members
          assert "src/measure_service/pilot_checks.py" in members
          assert "tests/test_pilot_checks.py" in members
          assert "tests/pilot_host_support.py" in members
          assert "docs/pilot-checks.md" in members
          for name in ("pilot_evidence", "pilot_transport", "pilot_cli", "pilot_entrypoint"):
              if name != "pilot_entrypoint":
                  assert "src/measure_service/" + name + ".py" in members
              assert "tests/test_" + name + ".py" in members
          assert "docs/pilot-client.md" in members
          assert "docs/pilot-host-record.md" in members
          assert "docs/store-recovery.md" in members
          for name in ("store_operations", "store_cli"):
              assert "src/measure_service/" + name + ".py" in members
              assert "tests/test_" + name + ".py" in members
          assert "tests/test_store_operations_boundaries.py" in members
          for name in ("http_operations", "operational_readiness"):
