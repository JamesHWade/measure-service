name: Service checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} contracts and docs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: air format --check .
      - run: jarl check .
      - run: python scripts/render_reference.py --check
      - run: python scripts/check_docs.py
      - run: python -m pytest -q -m 'not r_backend and not bo_backend'

  distribution:
    name: Installed wheel and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - name: Verify the source archive includes the reproduction guide and plot command
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archives = glob.glob("dist/*.tar.gz")
          assert len(archives) == 1
          with tarfile.open(archives[0]) as source:
              members = {member.name.partition("/")[2] for member in source.getmembers()}
          assert "docs/moses-reproduction.md" in members
          assert "scripts/plot_moses_replay.R" in members
          assert "scripts/plot_synthetic_campaigns.R" in members
          assert "docs/reference-data/synthetic-evaluations.csv" in members
          assert "docs/reference-data/synthetic-analytes.csv" in members
          assert "docs/reference-data/synthetic-reference.json" in members
          assert "docs/figures/synthetic-success.png" in members
          assert "docs/figures/synthetic-utility.svg" in members
          assert "docs/synthetic-ablations.md" in members
          assert "src/measure_service/benchmarks/synthetic_ablations.py" in members
          assert "src/measure_service/benchmarks/reference_data/synthetic-isocratic-ablation-v1.json" in members
          assert "scripts/export_ablation_reference.py" in members
          assert "scripts/plot_synthetic_ablations.R" in members
          assert "tests/test_ablation_publication.py" in members
          assert "docs/synthetic-ablation-results.md" in members
          assert "docs/reference-data/ablations/publication.json" in members
          assert "docs/reference-data/ablations/independent-review.json" in members
          assert "docs/reference-data/ablations/complete.json" in members
          assert "docs/reference-data/ablations/metadata.json" in members
          assert "docs/reference-data/ablations/evaluations.csv" in members
          assert "docs/reference-data/ablations/analytes.csv" in members
          assert "docs/reference-data/ablations/success-trajectories.csv" in members
          assert "docs/reference-data/ablations/paired-comparisons.csv" in members
          assert "docs/reference-data/ablations/paired-contrast-summary.csv" in members
          assert "docs/figures/ablation-success.png" in members
          assert "docs/figures/ablation-success.svg" in members
          assert "docs/figures/ablation-endpoints.png" in members
          assert "docs/figures/ablation-endpoints.svg" in members
          PY
      - name: Check upgrade from the standalone method distribution
        run: python scripts/check_distribution_upgrade.py dist/*.whl
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/measure-wheel
          /tmp/measure-wheel/bin/python -m pip install dist/*.whl pytest==9.2.0
      - name: Test installed package outside the checkout
        working-directory: /tmp
        run: |
          /tmp/measure-wheel/bin/python -m pytest -q "$GITHUB_WORKSPACE/tests" -m 'not r_backend and not bo_backend'
          /tmp/measure-wheel/bin/python "$GITHUB_WORKSPACE/examples/registry.py"
      - name: Install source archive and run the example
        run: |
          python -m venv /tmp/measure-sdist
          /tmp/measure-sdist/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/measure-sdist/bin/python - <<'PY'
          from importlib import metadata

          from measure_methods import constant_solvent_use, program_solvent_use
          import measure_service
          from measure_service.method_backend import method_backend_info

          files = {str(path) for path in metadata.distribution("measure-service").files or ()}
          assert "measure_methods/__init__.py" in files
          assert "measure_methods/volume.py" in files
          assert "measure_service/worker.R" in files
          assert constant_solvent_use(1, 1, {"A": 1}) == {"A": 1.0}
          assert program_solvent_use([0, 1], [1, 1], [{"A": 1}, {"A": 1}]) == {"A": 1.0}
          assert method_backend_info()["package"] == "measure-service"
          PY
          /tmp/measure-sdist/bin/python "$GITHUB_WORKSPACE/examples/registry.py"

  r-integration:
    name: Current R backend heads
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MEASURE_BACKEND_REF: main
      SEC_BACKEND_REF: main
    steps:
      - uses: actions/checkout@v4
      - name: Record service checkout source
        run: |
          revision="$(git rev-parse HEAD)"
          echo "measure-service checkout at integration: $revision"
          echo "measure-service checkout at integration: \`$revision\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Prepare isolated backend libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure-r-library" "$RUNNER_TEMP/measure-r-site"
          {
            echo "R_LIBS_USER=$RUNNER_TEMP/measure-r-library"
            echo "R_LIBS_SITE=$RUNNER_TEMP/measure-r-site"
            echo "MEASURE_MCP_R=$(command -v R)"
            echo "MEASURE_MCP_TEST_R=$(command -v R)"
          } >> "$GITHUB_ENV"
      - name: Record backend heads at job start
        shell: bash
        run: |
          set -euo pipefail
          for backend in measure measure.sec; do
            backend_ref="$MEASURE_BACKEND_REF"
            if [ "$backend" = measure.sec ]; then backend_ref="$SEC_BACKEND_REF"; fi
            observed_sha="$(git ls-remote --exit-code --heads "https://github.com/JamesHWade/$backend.git" "refs/heads/$backend_ref" | awk 'NR == 1 {print $1}')"
            [[ "$observed_sha" =~ ^[0-9a-f]{40}$ ]]
            echo "$backend ($backend_ref) at job start: $observed_sha"
            echo "$backend ($backend_ref) at job start: \`$observed_sha\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::jsonlite
            any::tibble
            any::recipes
            any::remotes
          cache: false
      - name: Install live backend branches with current CRAN dependencies
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          remotes::install_github(
            paste0("JamesHWade/measure@", Sys.getenv("MEASURE_BACKEND_REF")),
            dependencies = NA,
            upgrade = "never"
          )
          # The installed core must remain the one selected above.
          remotes::install_github(
            paste0("JamesHWade/measure.sec@", Sys.getenv("SEC_BACKEND_REF")),
            dependencies = FALSE
          )
          RS
      - name: Verify and record installed numerical backends
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          user_lib <- normalizePath(Sys.getenv("R_LIBS_USER"), mustWork = TRUE)
          for (package in c("measure", "measure.sec")) {
            installed <- normalizePath(find.package(package), mustWork = TRUE)
            stopifnot(startsWith(installed, paste0(user_lib, .Platform$file.sep)))
            description <- utils::packageDescription(package, lib.loc = user_lib)
            revision <- description$RemoteSha
            stopifnot(length(revision) == 1L, grepl("^[0-9a-f]{40}$", revision))
            expected_ref <- Sys.getenv(if (package == "measure") "MEASURE_BACKEND_REF" else "SEC_BACKEND_REF")
            stopifnot(identical(description$RemoteRef, expected_ref))
            variable <- if (package == "measure") "MEASURE_MCP_MEASURE_REVISION" else "MEASURE_MCP_SEC_REVISION"
            cat(paste0(variable, "=", revision, "\n"), file = Sys.getenv("GITHUB_ENV"), append = TRUE)
            cat(package, description$Version, "installed from", expected_ref, revision, "at", installed, "\n")
            cat(paste0("Installed ", package, ": `", revision, "`\n"), file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          }
          stopifnot(all(c("mw_col", "mw_scale") %in% names(formals(measure.sec::step_sec_mw_averages))))
          stopifnot(all(c("mw_col", "mw_scale", "integration_range") %in% names(formals(measure.sec::step_sec_mw_distribution))))
          for (package in c("recipes", "jsonlite", "tibble")) {
            cat(package, as.character(utils::packageVersion(package)), "\n")
          }
          cat("R", as.character(getRversion()), "\n")
          RS
      - run: python -m pip install '.[dev]'
      - name: Record installed method calculation distribution
        run: |
          python - <<'PY'
          import json
          import os

          from measure_service.method_backend import method_backend_info

          evidence = method_backend_info()
          assert evidence["package"] == "measure-service"
          assert evidence["version"]
          encoded = json.dumps(evidence, sort_keys=True)
          print(encoded)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Method calculation distribution: `{encoded}`\n")
          PY
      - name: Run complete service, HTTP, R and SEC contracts
        run: python -m pytest -q -m 'not bo_backend'

  bo-integration:
    name: Public BO-MCP runtime and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install service host
        run: python -m pip install '.[dev]'
      - name: Install optional public backend in a separate runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/measure-bo-sidecar"
          # The hosted runner exercises CPU models; avoid the PyPI CUDA bundle.
          "$RUNNER_TEMP/measure-bo-sidecar/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/measure-bo-sidecar/bin/python" -m pip install . 'bo-engine @ git+https://github.com/AccelerationConsortium/bo-mcp.git#subdirectory=packages/bo-engine'
          "$RUNNER_TEMP/measure-bo-sidecar/bin/python" -m pip check
          "$RUNNER_TEMP/measure-bo-sidecar/bin/python" -c 'import torch; assert torch.version.cuda is None; print("CPU PyTorch:", torch.__version__)'
          echo "MEASURE_BO_PYTHON=$RUNNER_TEMP/measure-bo-sidecar/bin/python" >> "$GITHUB_ENV"
      - name: Exercise actual GP suggestions, exact outcome consumption and restart
        run: python -m pytest -q -m bo_backend
